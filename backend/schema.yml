  /api/certificates/download/{certificate_code}/:
    get:
      operationId: download_certificate_pdf
      description: Download certificate PDF file by certificate code
      parameters:
      - in: path
        name: certificate_code
        schema:
          type: string
        required: true
      tags:
      - certificates
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/certificates/verify/{certificate_code}/:
    get:
      operationId: verify_certificate
      description: Public endpoint to verify authenticity of a certificate by unique
        code
      parameters:
      - in: path
        name: certificate_code
        schema:
          type: string
        required: true
      tags:
      - certificates
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificatePublicVerify'
          description: ''
  /api/chat/conversations/:
    get:
      operationId: list_conversations
      description: List all support chat conversations the current user is a participant
        in
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
          description: ''
    post:
      operationId: create_or_get_conversation
      description: Get or create a 1-on-1 support conversation for a course
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
  /api/chat/conversations/{conversation_id}/messages/:
    get:
      operationId: get_conversation_messages
      description: Retrieve paginated message history for a conversation (descending
        by timestamp)
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMessageList'
          description: ''
    post:
      operationId: send_conversation_message
      description: Send a message to a conversation via REST fallback
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MessageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MessageRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/chat/conversations/{conversation_id}/read/:
    post:
      operationId: mark_conversation_read
      description: Mark all incoming messages in a conversation as read
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
