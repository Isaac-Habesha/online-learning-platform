          minimum: -9223372036854775808
          format: int64
          description: File size in bytes
        mime_type:
          type: string
          description: MIME type of the video file
          maxLength: 100
        duration_seconds:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: Video duration in seconds
        width:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: Video width in pixels
        height:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: Video height in pixels
        status:
          $ref: '#/components/schemas/Status9a5Enum'
