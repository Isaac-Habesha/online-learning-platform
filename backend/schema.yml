    Video:
      type: object
      description: |-
        Serializer for Video model.
        Used for instructor video management.
      properties:
        id:
          type: integer
          readOnly: true
        lesson:
          type: integer
          readOnly: true
        storage_key:
          type: string
          readOnly: true
