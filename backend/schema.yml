          maxLength: 254
        first_name:
          type: string
          minLength: 1
          description: User first name
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          description: User last name
          maxLength: 100
        role:
          allOf:
          - $ref: '#/components/schemas/Role094Enum'
          description: |-
            User role (LEARNER or INSTRUCTOR)

            * `LEARNER` - Learner
            * `INSTRUCTOR` - Instructor
            * `ADMIN` - Administrator
        password:
